name: Refresh VisitSeoul events

on:
  schedule:
    # 매일 UTC 19:00 = 한국시간(KST) 새벽 4시
    - cron: '0 19 * * *'
  workflow_dispatch: {} # Actions 탭에서 수동으로도 실행 가능하게

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch VisitSeoul events
        env:
          VISITSEOUL_API_KEY: ${{ secrets.VISITSEOUL_API_KEY }}
        run: node scripts/fetch-visitseoul-events.js

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events
          git diff --cached --quiet || git commit -m "Refresh VisitSeoul events data"
          git push
